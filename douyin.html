<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音无水印视频下载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8em;
            background: linear-gradient(90deg, #ff0055, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            outline: none;
        }
        input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        input:focus {
            background: rgba(255,255,255,0.2);
        }
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(90deg, #ff0055, #ff6b6b);
            color: #fff;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255,0,85,0.4);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            display: none;
            margin-top: 30px;
            text-align: center;
        }
        .video-info {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .video-info img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .video-info h3 {
            font-size: 1.1em;
            margin-bottom: 10px;
            color: #fff;
        }
        .video-info .author {
            font-size: 0.9em;
            color: rgba(255,255,255,0.7);
        }
        .download-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(90deg, #00d4ff, #0099ff);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .download-btn:hover {
            transform: translateY(-2px);
        }
        .error {
            background: rgba(255,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #ff0055;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .tips {
            margin-top: 20px;
            font-size: 0.85em;
            color: rgba(255,255,255,0.5);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>抖音无水印视频下载</h1>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="粘贴抖音分享链接..." />
            <button id="parseBtn" onclick="parseVideo()">解析</button>
        </div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px;">解析中...</p>
        </div>
        <div class="error" id="error"></div>
        <div class="result" id="result">
            <div class="video-info">
                <img id="cover" src="" alt="视频封面" />
                <h3 id="title"></h3>
                <p class="author" id="author"></p>
            </div>
            <a id="downloadBtn" class="download-btn" href="#" target="_blank">下载视频</a>
        </div>
        <p class="tips">支持分享链接、短链接、视频页面链接</p>
    </div>

    <script>
        const API_URL = 'https://www.devtool.top/api/douyin/parse';

        async function parseVideo() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                showError('请输入抖音链接');
                return;
            }

            const btn = document.getElementById('parseBtn');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const result = document.getElementById('result');

            btn.disabled = true;
            error.style.display = 'none';
            result.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch(`${API_URL}?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data.code === 200 && data.data) {
                    document.getElementById('cover').src = data.data.video.cover || data.data.video.dynamic_cover || '';
                    document.getElementById('title').textContent = data.data.title || '无标题';
                    document.getElementById('author').textContent = data.data.author ? `作者: ${data.data.author}` : '';
                    
                    const downloadUrl = data.data.video.url || data.data.video.url_no_watermark || data.data.video.play_url;
                    document.getElementById('downloadBtn').href = downloadUrl;
                    
                    result.style.display = 'block';
                } else {
                    showError(data.msg || '解析失败，请检查链接是否正确');
                }
            } catch (e) {
                showError('网络错误，请稍后重试');
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function showError(msg) {
            const error = document.getElementById('error');
            error.textContent = msg;
            error.style.display = 'block';
        }

        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') parseVideo();
        });
    </script>
</body>
</html>
